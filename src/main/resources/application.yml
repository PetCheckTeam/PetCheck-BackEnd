spring:
  application:
    name: server

  # 1. Database 연결 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    # 로컬 PostgreSQL의 petcheck_db 연결
    url: jdbc:postgresql://localhost:5432/petcheck_db
    username: postgres # 기본 계정명 (설치 시 변경 안 하셨다면 postgres 입니다)
    password: ${DB_PASSWORD} # ⚠️ 방금 PostgreSQL 설치할 때 설정하신 비밀번호로 수정해 주세요!

  # 2. JPA & Hibernate 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 엔티티 기반으로 DB 테이블 자동 생성/수정
    show-sql: true # 실행되는 SQL 쿼리를 콘솔에 출력
    properties:
      hibernate:
        format_sql: true # SQL 문법을 예쁘게 정렬하여 출력

# 3. JWT 인증 관련 기본 설정 (비밀키 및 토큰 유효시간)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24시간 (ms 단위)